<!DOCTYPE html>
<html>
<head>
    <title>Test Email Form</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #113D48; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1CA8CB; }
        .message { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h2>Test Email Form</h2>
    <p>This form will test the email functionality to shivam.it1311@gmail.com</p>
    
    <form id="testForm">
        <div class="form-group">
            <label for="first_name">First Name *</label>
            <input type="text" name="first_name" id="first_name" required>
        </div>
        
        <div class="form-group">
            <label for="last_name">Last Name *</label>
            <input type="text" name="last_name" id="last_name" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" name="email" id="email" required>
        </div>
        
        <div class="form-group">
            <label for="phone">Phone *</label>
            <input type="tel" name="phone" id="phone" required>
        </div>
        
        <div class="form-group">
            <label for="tour_name">Tour Name</label>
            <input type="text" name="tour_name" id="tour_name" value="Test Tour">
        </div>
        
        <div class="form-group">
            <label for="travel_date">Travel Date *</label>
            <input type="date" name="travel_date" id="travel_date" required>
        </div>
        
        <div class="form-group">
            <label for="adults">Adults *</label>
            <select name="adults" id="adults" required>
                <option value="">Select</option>
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="children">Children</label>
            <select name="children" id="children">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="special_requests">Special Requests</label>
            <textarea name="special_requests" id="special_requests" rows="3">This is a test message to verify email functionality.</textarea>
        </div>
        
        <div class="form-group">
            <label for="captcha">Security Check: 5 + 3 = ? *</label>
            <input type="number" name="captcha" id="captcha" required>
        </div>
        
        <!-- Hidden fields -->
        <input type="hidden" name="form_type" value="booking">
        <input type="hidden" name="website_url" value="">
        <input type="hidden" name="csrf_token" value="test-token">
        
        <button type="submit">Send Test Email</button>
    </form>
    
    <div id="message"></div>
    
    <script>
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const messageDiv = document.getElementById('message');
            
            // Show loading message
            messageDiv.innerHTML = '<div class="message">Sending email...</div>';
            
            fetch('/api/mail.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                if (data.includes('success') || data.includes('Thank you')) {
                    messageDiv.innerHTML = '<div class="message success">✓ Email sent successfully to shivam.it1311@gmail.com!</div>';
                    this.reset();
                } else {
                    messageDiv.innerHTML = '<div class="message error">✗ Error: ' + data + '</div>';
                }
            })
            .catch(error => {
                messageDiv.innerHTML = '<div class="message error">✗ Connection error: ' + error.message + '</div>';
            });
        });
    </script>
</body>
</html>
